version: 2

sources:
  - name: raw
    description: "Raw orders landed by the ELT extract/load steps."
    schema: main
    tables:
      - name: raw_orders
        description: "One row per source order, keyed by id."
        columns:
          - name: id
            description: "Natural key from the source system."
            tests:
              - not_null
              - unique

models:
  - name: stg_orders
    description: "Cleaned and typed orders."
    columns:
      - name: order_id
        description: "Order natural key."
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: mart_customer_orders
    description: "Customer-level order aggregates consumed by BI."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: order_count
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null
